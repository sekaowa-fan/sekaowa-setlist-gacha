// ライブ定番曲（出やすくする）
const standardSongs = [

"Habit",

"Dropout",
"スターゲイザー"
];


// レア曲（出にくくする）
const rareSongs = [

"白昼の夢",
"Never Ending World",
"花鳥風月",
"yume",

// ラスト候補曲（最後に出やすくする）
const endingSongs = [
"Dragon Night",
"インスタントラジオ",
"Fight Music"
];

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function weightedPick(array, mode="normal"){

    let weighted=[];

    array.forEach(song=>{

        let weight=1;


        // ライブ定番曲
        if(standardSongs.includes(song)){
            weight *= 3;
        }


        // レア曲
        if(rareSongs.includes(song)){
            weight *= 0.3;
        }


        // 1曲目補正
        if(mode === "opening" && standardSongs.includes(song)){
            weight *= 3;
        }


        // ラスト補正
        if(mode === "ending" && endingSongs.includes(song)){
            weight *= 5;
        }


        // 小数対応
        for(let i=0;i<Math.round(weight*10);i++){
            weighted.push(song);
        }

    });


    return weighted[
        Math.floor(Math.random()*weighted.length)
    ];

}
    
function generateSetlist(){

    const mainCount = Number(
        document.getElementById("mainCount").value
    );

    const encoreCount = Number(
        document.getElementById("encoreCount").value
    );


    if(songs.length < mainCount + encoreCount){
        document.getElementById("result").innerHTML =
        "登録曲数が足りません。";
        return;
    }


    let pool=[...songs];
　　

let main=[];


// 1曲目
main.push(weightedPick(pool,"opening"));
    
pool = pool.filter(
song=>song !== main[0]
);


// 残り本編
while(main.length < mainCount - 1){

let pick = weightedPick(pool);

main.push(pick);

pool = pool.filter(
song=>song !== pick
);

}


while(encore.length < encoreCount - 1){

let pick = weightedPick(pool);

encore.push(pick);

pool = pool.filter(
song=>song !== pick
);

}


// アンコール
let encore=[];

while(encore.length < encoreCount - 1){

let pick = weightedPick(pool);

encore.push(pick);

pool = pool.filter(
song=>song !== pick
);

}


// アンコール最後
if(encoreCount > 0){

let lastEncore = weightedPick(pool,"ending");

encore.push(lastEncore);

}
    let html="";

    html += "<h2>【本編】</h2>";

    main.forEach((song,index)=>{
        html += `${index+1}. ${song}<br>`;
    });

    html += "<br><h2>【Encore】</h2>";

    encore.forEach((song,index)=>{
        html += `${index+19}. ${song}<br>`;
    });

    let index = 0;
let output = "";

document.getElementById("result").innerHTML = "";

let timer = setInterval(() => {

    if(index < main.length){

        output += `${index + 1}. ${main[index]}<br>`;
        document.getElementById("result").innerHTML = output;

        index++;

    } else if(index === main.length){

        output += "<br><h2>【Encore】</h2>";
        document.getElementById("result").innerHTML = output;

        index++;

    } else if(index < main.length + encore.length + 1){

        let encoreIndex = index - main.length - 1;

        output += `${main.length + encoreIndex + 1}. ${encore[encoreIndex]}<br>`;
        document.getElementById("result").innerHTML = output;

        index++;

    } else {

        clearInterval(timer);

    }

}, 100);
}
