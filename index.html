// ライブ定番曲（出やすくする）
const standardSongs = [
"スターライトパレード",
"Habit",
"Fight Music",

];


// レア曲（出にくくする）
const rareSongs = [

];


// ラスト候補曲（最後に出やすくする）
const endingSongs = [
"Dragon Night",
"インスタントラジオ",
"Fight Music"
];

let currentSetlist = "";
    
function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function weightedPick(array, mode="normal"){

    let weighted=[];

    array.forEach(song=>{

        let weight=1;


        // ライブ定番曲
        if(standardSongs.includes(song)){
            weight *= 3;
        }


        // レア曲
        if(rareSongs.includes(song)){
            weight *= 0.3;
        }


        // 1曲目補正
        if(mode === "opening" && standardSongs.includes(song)){
            weight *= 3;
        }


        // ラスト補正
        if(mode === "ending" && endingSongs.includes(song)){
            weight *= 5;
        }


        // 小数対応
        for(let i=0;i<Math.round(weight*10);i++){
            weighted.push(song);
        }

    });


    return weighted[
        Math.floor(Math.random()*weighted.length)
    ];

}
    
function generateSetlist(){
    
    const mainCount = Number(
        document.getElementById("mainCount").value
    );

    const encoreCount = Number(
        document.getElementById("encoreCount").value
    );


    if(songs.length < mainCount + encoreCount){
        document.getElementById("result").innerHTML =
        "登録曲数が足りません。";
        return;
    }
    
let pool=[...songs];

// 除外曲を取得
let excludeSongs = [];

document.querySelectorAll(".excludeSong").forEach(input=>{

    let song = input.value.trim();

    if(song && songs.includes(song)){
        excludeSongs.push(song);
    }

});


// 除外曲をプールから削除
pool = pool.filter(
song => !excludeSongs.includes(song)
);

let main=[];


// 指定曲を保存
let fixedSongs = [];

document.querySelectorAll(".fixedSong").forEach(input=>{

    let song = input.value.trim();

    if(song && songs.includes(song)){
        fixedSongs.push(song);

        pool = pool.filter(
            s => s !== song
        );
    }

});

// 指定曲がない場合だけ1曲目抽選
if(main.length === 0){

    let opening = weightedPick(pool,"opening");

    main.push(opening);

    pool = pool.filter(
    song=>song !== opening
    );

}


// 残り本編
while(main.length < mainCount - fixedSongs.length){

let pick = weightedPick(pool);

main.push(pick);

pool = pool.filter(
song=>song !== pick
);

}

// 指定曲をランダム位置へ配置
fixedSongs.forEach(song=>{

    let position = Math.floor(
        Math.random() * (main.length + 1)
    );

    main.splice(position,0,song);

});


// アンコール
let encore=[];

while(encore.length < encoreCount){

let pick = weightedPick(pool);

encore.push(pick);

pool = pool.filter(
song=>song !== pick
);

}
    
    let html="";

    html += "<h2>【本編】</h2>";

    main.forEach((song,index)=>{
        html += `${index+1}. ${song}<br>`;
    });

    html += "<br><h2>【Encore】</h2>";

    encore.forEach((song,index)=>{
        html += `${index+19}. ${song}<br>`;
    });

    let index = 0;
let output = "";

document.getElementById("result").innerHTML = "";

let timer = setInterval(() => {

    if(index < main.length){

        output += `${index + 1}. ${main[index]}<br>`;
        document.getElementById("result").innerHTML = output;

        index++;

    } else if(index === main.length){

        output += "<br><h2>【Encore】</h2>";
        document.getElementById("result").innerHTML = output;

        index++;

    } else if(index < main.length + encore.length + 1){

        let encoreIndex = index - main.length - 1;

        output += `${main.length + encoreIndex + 1}. ${encore[encoreIndex]}<br>`;
        document.getElementById("result").innerHTML = output;

        index++;

    } else {

        currentSetlist = output;

        clearInterval(timer);

    }

}, 100);
}

function saveSetlist(){

    if(currentSetlist === ""){

        alert("保存するセトリがありません");

        return;
    }

    let saved = JSON.parse(
        localStorage.getItem("savedSetlists")
        || "[]"
    );

    let title = prompt(
        "セトリ名を入力してください"
    );

    if(!title){

        let firstSong =
        currentSetlist.match(
        /\d+\.\s(.+?)<br>/
        );

        title = firstSong
        ? firstSong[1] + "始まり"
        : "無題のセトリ";

    }

    saved.push({

        title:title,

        date:new Date().toLocaleString(),

        setlist:currentSetlist

    });

    localStorage.setItem(
        "savedSetlists",
        JSON.stringify(saved)
    );

    alert("保存しました！");
            }

function showSavedSetlists(){

    let saved = JSON.parse(
        localStorage.getItem("savedSetlists")
        || "[]"
    );

    if(saved.length === 0){

        alert("保存されたセトリはありません");

        return;
    }

    let html =
    "<h2>📚 保存済みセトリ</h2>";

    saved.forEach((item,index)=>{

     html += `
<hr>

<h3>${item.title}</h3>

${item.date}

<br><br>

${item.setlist}

<br>

<button onclick="deleteSetlist(${index})">
🗑削除
</button>

`;

    });

    document.getElementById("result")
    .innerHTML = html;
}

function deleteSetlist(index){

    let saved = JSON.parse(
        localStorage.getItem("savedSetlists")
        || "[]"
    );

    saved.splice(index,1);

    localStorage.setItem(
        "savedSetlists",
        JSON.stringify(saved)
    );

    showSavedSetlists();

}

function addSettingRow(){

let area =
document.getElementById("settingArea");

let card =
document.createElement("div");

card.className = "settingCard";

card.innerHTML = `

<label>曲名</label>
<input
type="text"
class="songName"
placeholder="曲名">

<label>モード</label>
<select
class="songMode"
onchange="togglePosition(this)">

<option value="fixed">
必ず入れる
</option>

<option value="exclude">
除外
</option>

<option value="position">
位置固定
</option>

</select>

<div class="positionArea"
style="display:none;">

<label>位置</label>

<input
type="text"
class="songPosition"
placeholder="本編1">

</div>

<button
type="button"
class="deleteBtn"
onclick="this.parentElement.remove()">

🗑️削除

</button>

`;

area.appendChild(card);

}

for(let i=0;i<5;i++){
addSettingRow();
}

function togglePosition(select){

let card =
select.closest(".settingCard");

let positionArea =
card.querySelector(".positionArea");

if(select.value === "position"){

    positionArea.style.display =
    "block";

}else{

    positionArea.style.display =
    "none";

}

    }
    
</script>
