function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function generateSetlist(){

    if(songs.length < 20){
        document.getElementById("result").innerHTML =
        "曲数が20曲未満です。20曲以上登録してください。";
        return;
    }

    let pool=[...songs];

    shuffle(pool);

    const main = pool.slice(0,18);
    const encore = pool.slice(18,20);

    let html="";

    html += "<h2>【本編】</h2>";

    main.forEach((song,index)=>{
        html += `${index+1}. ${song}<br>`;
    });

    html += "<br><h2>【Encore】</h2>";

    encore.forEach((song,index)=>{
        html += `${index+19}. ${song}<br>`;
    });

    document.getElementById("result").innerHTML =
"<h2>OPENING...</h2>";

setTimeout(() => {

    document.getElementById("result").innerHTML =
    "<h2>LIVE START</h2>";

    setTimeout(() => {

        document.getElementById("result").innerHTML = html;

    }, 1000);

}, 1000);
}
